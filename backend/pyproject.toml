[project]
name = "stock-hyperion-backend"
version = "0.1.0"
description = "AI stock ranking research platform — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<0.28",
    "tenacity>=9.0,<10.0",
    "python-dateutil>=2.9,<3.0",
    "anthropic>=1.0,<2.0",
    "scikit-learn>=1.5,<1.6",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.1",
    "joblib>=1.4,<1.5",
    "scipy>=1.13,<1.14",
    "pyjwt>=2.9,<2.10",
    "xgboost>=2.1,<2.2",
    "lightgbm>=4.5,<4.6",
    "apscheduler>=3.10,<3.11",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
