services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_intel}
      POSTGRES_DB: ${POSTGRES_DB:-stock_intel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock_intel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock_intel}:${POSTGRES_PASSWORD:-stock_intel}@db:5432/${POSTGRES_DB:-stock_intel}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock_intel}:${POSTGRES_PASSWORD:-stock_intel}@db:5432/${POSTGRES_DB:-stock_intel}_test
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock_intel}:${POSTGRES_PASSWORD:-stock_intel}@db:5432/${POSTGRES_DB:-stock_intel}
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
